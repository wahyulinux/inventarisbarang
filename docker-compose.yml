version: '3.3'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laravel_app_dev
    restart: always
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    depends_on:
      - db
      - redis

  db:
    image: postgres:15-alpine
    container_name: postgres_db_dev
    restart: always
    environment:
      POSTGRES_DB: ${DB_DATABASE:-inventory_db}
      POSTGRES_USER: ${DB_USERNAME:-root}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-root_password}
    ports:
      - "5432:5432"
    volumes:
      - pg_data_dev:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: redis_storage_dev
    restart: always
    ports:
      - "6379:6379"

volumes:
  pg_data_dev:
